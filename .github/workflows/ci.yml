name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Lint PHP files
        run: |
          set -e
          while IFS= read -r file; do
            case "$file" in
              dist/*) continue ;;
            esac
            php -l "$file"
          done < <(git ls-files '*.php')

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks scans the pushed commit range (before^..after), so it
          # needs history beyond the default shallow clone.
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
